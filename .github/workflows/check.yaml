on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calcit-dbt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: calcit-dbt

      # The path dependency is checked out as a sibling, matching local development.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dual-balanced-ternary/dual_balanced_ternary.rs
          path: dual_balanced_ternary.rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: calcit-dbt

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          deps-file: calcit-dbt/deps.cirru
          tools: calcit,caps

      - run: cargo fmt -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --all-targets

      - run: ./build.sh

      - run: bash scripts/check-c-safe-ffi.sh

      - run: caps --strict --ci

      - name: Validate canonical typed snapshot
        run: |
          set -euo pipefail
          test "$(calcit --version)" = "0.28.0"
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze check-public --ns dbt.core --ns dbt.main --ns dbt.util --summary-only --format json

      - run: calcit calcit.cirru
