on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calcit-dbt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: calcit-dbt
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: calcit-dbt

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          deps-file: calcit-dbt/deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"

      - run: cargo fmt -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --all-targets

      - run: ./build.sh

      - run: bash scripts/check-c-safe-ffi.sh

      - run: caps --strict --ci

      - name: Validate canonical typed snapshot
        run: |
          set -euo pipefail
          caps deps.cirru verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          report="$(calcit calcit.cirru fix --workflow strict --verify --format json)"
          printf '%s\n' "$report"
          jq -e '.data.workflow.status? == "passed" and .diagnostics? == []' <<< "$report"
          calcit analyze weak-types --only coverage --summary-only --format json | jq -e '.data.summary.levels.none == 0 and .data.summary.levels.partial == 0'
          calcit analyze weak-types --only unsafe-coerce,schema-dynamic,unresolved-type-slot,code-dynamic,code-nil --summary-only --format json | jq -e '.data.summary.hits == 0'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'

      - run: calcit calcit.cirru
