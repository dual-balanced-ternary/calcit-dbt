on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calcit-dbt
    steps:
      - uses: actions/checkout@v6
        with:
          path: calcit-dbt

      # The binding tracks the sibling core crate until 0.2 is published.
      - uses: actions/checkout@v6
        with:
          repository: dual-balanced-ternary/dual_balanced_ternary.rs
          path: dual_balanced_ternary.rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calcit-dbt

      - uses: calcit-lang/setup-cr@0.0.8
        with:
          version: "0.13.44"

      - run: cargo fmt -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --all-targets

      - run: ./build.sh

      - run: cr --check-only

      - run: cr analyze quality --baseline config/calcit-quality.json

      - run: cr
