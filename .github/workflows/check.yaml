on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calcit-dbt
    steps:
      - uses: actions/checkout@v6
        with:
          path: calcit-dbt

      # The path dependency is checked out as a sibling, matching local development.
      - uses: actions/checkout@v6
        with:
          repository: dual-balanced-ternary/dual_balanced_ternary.rs
          path: dual_balanced_ternary.rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calcit-dbt

      - uses: calcit-lang/setup-calcit@v1.3.0
        with:
          deps-file: calcit-dbt/deps.cirru
          tools: calcit,caps

      - run: cargo fmt -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --all-targets

      - run: ./build.sh

      - run: bash scripts/check-c-safe-ffi.sh

      - run: caps --strict --ci

      - name: Validate canonical typed snapshot
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality
          calcit calcit.cirru analyze dynamic-methods --max 0

      - run: calcit calcit.cirru
